allowBuilds:
  esbuild: true
  workerd: true
# These exact packages were intentionally selected on 2026-07-28 to keep the
# Worker toolchain current. This narrowly bypasses pnpm's optional release-age
# quarantine without disabling supply-chain checks for any other dependency.
minimumReleaseAgeExclude:
  - '@cloudflare/vitest-pool-workers@0.19.0'
  - '@cloudflare/workers-types@5.20260728.1'
  - miniflare@4.20260722.1
  - wrangler@4.115.0
